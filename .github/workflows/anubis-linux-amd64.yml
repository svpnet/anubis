name: Anubis Linux amd64

on:
  push:
    branches:
      - codex/verification-page-v1.28.2

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b151b # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          target: wasm32-unknown-unknown
          build-warnings: warn

      - uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3

      - name: Build embedded assets
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli zstd
          npm ci
          npm run assets

      - name: Build and verify Anubis
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          version="v$(cat VERSION)+${GITHUB_SHA:0:12}"
          binary=var/anubis-linux-amd64
          go build -trimpath -ldflags "-s -w -X github.com/TecharoHQ/anubis.Version=$version" -o "$binary" ./cmd/anubis
          test "$("$binary" --version)" = "Anubis $version"
          file "$binary"
          sha256sum "$binary"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: var/anubis-linux-amd64
          archive: false
          if-no-files-found: error
